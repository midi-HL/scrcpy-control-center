name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake (Win32 x86)
      run: cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: Build
      run: cmake --build build --config ${{ matrix.config }}

    - name: Prepare release package
      run: |
        mkdir release
        copy build\${{ matrix.config }}\ScrcpyControlCenter.exe release\
        xcopy /E /I config release\config
        copy LICENSE release\ 2>nul || echo MIT > release\LICENSE

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScrcpyControlCenter-Win32-${{ matrix.config }}
        path: release/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ScrcpyControlCenter-Win32-Release
        path: release/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
